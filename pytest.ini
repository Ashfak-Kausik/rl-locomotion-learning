[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers --tb=short
markers =
    needs_policy: requires the walk-these-ways .jit checkpoints
    slow: takes more than a couple of seconds

filterwarnings =
    # TorchScript is deprecated upstream, but it is NOT optional here: the
    # pretrained walk-these-ways checkpoints ARE .jit files, and Stage 2's
    # loader is torch.jit.load. Stage 3 must export the same format to stay
    # evaluable by the same harness. Revisit only if the whole pipeline moves.
    ignore:`torch\.jit.*is deprecated:DeprecationWarning
