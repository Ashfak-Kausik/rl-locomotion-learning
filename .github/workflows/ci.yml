name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # MuJoCo needs an OpenGL runtime even for headless physics; OSMesa
      # provides software rendering so no display or GPU is required.
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libosmesa6 libglfw3 swig

      # CPU-only torch: the CUDA wheel is ~2.5 GB and buys nothing here.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify environment
        env:
          MUJOCO_GL: osmesa
        run: python scripts/check_env.py

      - name: Run test suite
        env:
          MUJOCO_GL: osmesa
        run: python -m pytest -v

      # Proves the published figures still regenerate from the committed CSVs,
      # and that terrain scenes are byte-identical to what is in git.
      - name: Verify reproducibility
        env:
          MUJOCO_GL: osmesa
        run: |
          python stage2-go2-mujoco-inference/experiments/make_figures.py
          python stage2-go2-mujoco-inference/experiments/generate_terrain_scenes.py
          git diff --exit-code -- stage2-go2-mujoco-inference/scenes/

      # End-to-end: train briefly, export to TorchScript, and confirm Stage 2's
      # harness can evaluate the result without modification.
      - name: Stage 3 round-trip
        env:
          MUJOCO_GL: osmesa
        run: |
          python stage3-go2-training/export.py --random --out-dir /tmp/ci-policy
          GO2_POLICY_DIR=/tmp/ci-policy python - <<'PY'
          import os, sys
          sys.path.insert(0, "stage2-go2-mujoco-inference")
          sys.path.insert(0, "stage2-go2-mujoco-inference/experiments")
          from harness import run_trial
          import paths
          body, adapt = paths.load_policy()
          scene = os.path.abspath("stage2-go2-mujoco-inference/scenes/go2_flat.xml")
          r = run_trial(scene, lin_vel_x=0.5, settle_s=0.5, measure_s=1.0,
                        body_net=body, adapt_net=adapt, seed=0)
          assert "mean_vx" in r and "fell" in r, r
          print("Stage 3 export evaluated by Stage 2 harness:", r["scene"], "OK")
          PY

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose -f docker/compose.yaml build lab

      - name: Run checks in container
        run: |
          docker compose -f docker/compose.yaml run --rm headless \
            python scripts/check_env.py
          docker compose -f docker/compose.yaml run --rm headless \
            python -m pytest -q
